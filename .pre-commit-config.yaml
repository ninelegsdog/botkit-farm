# Хуки, которые ловят то, что не поймает CI позже: секреты, мусор и баги
# до того, как они попадут в коммит.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pydantic, types-PyYAML]

  - repo: local
    hooks:
      # База знаний (obsidian/) внутренняя и в git не отслеживается, поэтому
      # хук срабатывает только там, где она есть — локально или в форке с базой.
      - id: obsidian-links
        name: связность базы знаний
        entry: python3 obsidian/_check_links.py
        language: system
        files: ^obsidian/.*\.md$
        pass_filenames: false

  # Секреты: бот может показать свой .env в ответе, а отчёт уезжает в git.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
