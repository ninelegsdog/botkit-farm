[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "botkit-farm"
version = "0.1.0"
description = "Ферма тест-кейсов для Telegram-ботов: прогон реального кода без Telegram, снимки экрана и баг-репорты"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ninelegsdog" }]
keywords = ["telegram", "bot", "testing", "scenarios", "screenshots"]
# Классификаторы — не украшение: по ним PyPI фильтрует пакет, а «3.11/3.12/3.13»
# обязаны совпадать с матрицей CI (ТЗ D2), иначе пакет обещает то, что не
# проверено. Лицензия дублируется полем `license` выше.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Russian",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Acceptance",
]

# Версии зафиксированы ровно те, что работают в проде стенда: aiogram 3.x,
# playwright 1.x и pillow 12.x — проверенная связка. Нижняя граница «>=» стоит
# лишь там, где апгрейд ничего не ломает; aiogram и playwright — точные, потому
# что смена их мажорной версии меняет и API диспетчера, и поведение сценариев.
dependencies = [
  "aiogram==3.31.0",
  "aiohttp>=3.9,<4",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  # Jinja2 — только для шаблонов кейсов (C6). Рендер живёт в процессе фермы,
  # а не бота: в окружении бота Jinja2 нет и не должно быть.
  "Jinja2>=3.1,<4",
  "playwright==1.63.0",
  "pillow>=10.0",
]

[project.urls]
# Ссылки на страницу проекта: без них карточка пакета на PyPI не ведёт никуда.
Homepage = "https://github.com/ninelegsdog/botkit-farm"
Repository = "https://github.com/ninelegsdog/botkit-farm"
Issues = "https://github.com/ninelegsdog/botkit-farm/issues"
Changelog = "https://github.com/ninelegsdog/botkit-farm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Параллельный прогон (ТЗ D1): worksteal — тесты разной длительности.
  "pytest-xdist>=3.8",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "mutmut==3.8.0",
]

[project.scripts]
botkit-farm = "botkit_farm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/botkit_farm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# D — докстроки у всех публичных объектов: этот проект читают через полгода
# теми же словами, что и сейчас, и именно они объясняют «почему так».
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RET", "ARG", "D"]
ignore = [
  "D203",  # конфликтует с D211
  "D213",  # конфликтует с D212
  "E501",  # длину строк контролирует ruff formatter, не линтер
]

[tool.ruff.lint.per-file-ignores]
# Тесты и скрипты допускают магические числа и длинные assert-сообщения.
"tests/*" = ["D", "S101", "B011", "ARG"]
"scripts/*" = ["D", "S"]
# Перенесённые из прежнего стенда модули: логика их не менялась, а докстринги
# там написаны по правилам того проекта. Правка формата здесь была бы
# косметикой ценой реального изменения перенесённого кода.
"src/botkit_farm/fake_api.py" = ["D103", "D101", "D102", "D107", "S112"]
"src/botkit_farm/scene.py" = ["D101", "D103"]
"src/botkit_farm/render.py" = ["D103", "D205"]
"src/botkit_farm/stand.py" = ["D103", "D205"]
"src/botkit_farm/adapters/*.py" = ["D103", "ARG001", "S112"]
# Фикстуры перенесены из прежнего стенда без правок: они пишут через API бота
# (db.session()), а не через sqlite3, и их логика проверена старыми прогонами.
"src/botkit_farm/fixtures/*.py" = ["D", "S101", "B", "ARG", "E501"]

[tool.ruff.lint.flake8-bugbear]
# assert в проде-коде — это не проверка, а отказ работать; в этой кодовой базе
# проверки живут в тестах, и «assert» в раннере означал бы пропуск проверок при
# python -O.
extend-immutable-calls = ["fastapi.Depends", "pydantic.Field"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = []
# Код бота — чужой и без аннотаций; мы его импортируем динамически.
# sqlalchemy нужен фикстурам (db.session()), но ставится он в venv бота, а не
# фермы, — поэтому в окружении фермы его нет и mypy об этом не должен шуметь.
[[tool.mypy.overrides]]
module = ["aiogram.*", "yaml.*", "redis.*", "sqlalchemy.*"]
ignore_missing_imports = true

# src.* — это модули КЛОНИРОВАННОГО бота (src.app, src.core.*). В ферме их нет:
# они появляются в песочнице во время прогона. Адаптеры их импортируют по
# имени, поэтому mypy об их отсутствии предупреждать не должен.
[[tool.mypy.overrides]]
module = ["botkit_farm.adapters.*", "src.*"]
ignore_missing_imports = true

# Фикстуры перенесены без аннотаций — они повторяют вызовы API бота, и типы там
# не несут смысла: проверяет их сам прогон.
[[tool.mypy.overrides]]
module = ["botkit_farm.fixtures", "botkit_farm.fixtures.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_generics = false
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "slow: прогоняет реальный бот целиком (нужен Redis на 6380 и клон репозитория)",
]

[tool.mutmut]
# Мутационное тестирование: покрытие показывает исполненные строки, а не
# проверенное поведение. Мутируем только критичные модули и только покрытые
# строки — иначе раннер неделями гоняет мутантов в коде, который не про
# вердикт кейса.
#
# `source_paths` — нынешнее имя `paths_to_mutate` (в 3.8 первое, второе
# deprecated): в ТЗ модуль назван старым ключом.
source_paths = ["src/botkit_farm"]
# Данные кейсов обязаны попасть в дерево мутанта. mutmut копирует в `mutants/`
# только `source_paths`, поэтому без этой строки `cases/` там нет — и тесты,
# читающие боевые кейсы, в мутационном прогоне либо падают («нет данных»), либо
# пропускаются, то есть молча не проверяют ничего. `also_copy` делает их
# работающими в дереве мутанта, а не обойдёнными через skipif.
also_copy = ["cases/"]
only_mutate = [
  "src/botkit_farm/case/model.py",
  "src/botkit_farm/runner/engine.py",
  "src/botkit_farm/security.py",
  # Гейты покрытия и источника: мутант в них, выживший при зелёных тестах,
  # означал бы гейт, который пропускает сломанное правило.
  "src/botkit_farm/coverage.py",
  "src/botkit_farm/source.py",
]
# Мутанты, признанные эквивалентными: строка `source=getattr(case, "source", "") or ""`
# в `_начальный_результат` — `source` у Case обязателен и непуст (min_length=1),
# поэтому default и `or ""` никогда не срабатывают; мутации их не меняют
# наблюдаемый результат.
do_not_mutate_patterns = [
  'source=getattr\(case, "source"',
]
mutate_only_covered_lines = true
# Отбор тестов: без рендера. Playwright на каждый мутант — минуты впустую, а
# кадры вердикт кейса не проверяют.
pytest_add_cli_args = ["-m", "not slow", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
  "tests/test_case.py",
  "tests/test_engine.py",
  "tests/test_media.py",
  "tests/test_contract.py",
  "tests/test_migration.py",
  "tests/test_security.py",
  "tests/test_pack.py",
  "tests/test_report.py",
  "tests/test_inspect.py",
  "tests/test_run.py",
  "tests/test_coverage.py",
  "tests/test_local_source.py",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B404/B603/B607: ферма по определению запускает процессы — git (клон и коммит),
# pip и venv (окружение бота). Аргументы там фиксированы кодом, пользовательский
# ввод в них не попадает; настоящий риск — токены и egress, их ловит
# tests/test_security.py. B112 в перенесённом адаптере legacy — тоже проверено
# прогонами. B405: `xml.etree` в отчёте только **пишет** JUnit XML
# (`Element`/`tostring`), чужой XML ферма не парсит — атака на парсер неприменима.
skips = ["B404", "B603", "B607", "B112", "B405"]