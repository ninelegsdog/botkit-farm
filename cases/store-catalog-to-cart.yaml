# Кейс написан по коду src/store/handlers.py.
#   botkit-farm study ~/BOTKIT-FARM/bots/botkit-store
#
#   /start              → handlers.py:19  «🛍 Добро пожаловать в магазин!» + меню
#   текст «🛍 Каталог»  → handlers.py:25  «Выберите категорию:» + store_cat:<id>
#   store_cat:<id>      → handlers.py:45  карточки товаров + «🛒 В корзину»
#   store_cart:<id>     → handlers.py:66  «✅ Добавлено в корзину!»
#
# Важно: пункт «Каталог» — обычная ТЕКСТОВАЯ кнопка нижнего меню, а не инлайн.
# Поэтому первый переход — это send, а не click. Перепутать эти два — значит
# написать кейс, который проверяет не тот интерфейс.

schema_version: 1
id: store-catalog-to-cart
title: Каталог магазина и добавление товара в корзину
description: >-
  Клиент открывает магазин, заходит в каталог, выбирает категорию, добавляет
  товар в корзину. Это ядро торгового бота: если этот путь не работает,
  магазин не продаёт ничего.
source: https://github.com/ninelegsdog/botkit-store
builder: newgen
fixture: store

seed: true

frame: window
frame_title: StoreBot · магазин
frame_handle: "@StoreKitBot"
publishable: true

tags: [smoke, ui]
covers: store-flow

steps:
  # Старт: приветствие и нижнее меню.
  - send: "/start"
    expect:
      text_contains: ["Добро пожаловать в магазин"]

  # Каталог — ТЕКСТОВАЯ кнопка меню, бот отвечает сообщением со списком.
  # Категории задаёт фикстура (fixtures/store.py: CATEGORIES — «Шаблоны», «Иконки»),
  # поэтому сверяем и число, и подписи: молчаливо разъехавшееся число — это
  # изменившиеся данные, а не баг бота.
  - send: "🛍 Каталог"
    pause: 2.5
    expect:
      text_contains: ["Выберите категорию:"]
      buttons_count: 2
      buttons_contains: ["Шаблоны", "Иконки"]

  # Категория: бот присылает карточку товара с кнопками «В корзину»/«Купить».
  # Состав товаров задаёт фикстура, поэтому берём первую категорию.
  - pick: first
    pause: 2.5
    expect:
      buttons_contains: ["🛒 В корзину"]

  # Добавление в корзину: бот отвечает всплывающим уведомлением.
  - click: "🛒 В корзину"
    pause: 2.5
    expect:
      text_contains: ["Добавлено в корзину"]