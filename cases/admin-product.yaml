schema_version: 1
id: admin-product
title: Управление товарами в админке
description: >-
  Админ открывает товары категории, заходит в карточку товара и проверяет
  действия: редактирование, активность, пополнение ключей, удаление.
source: /home/algtro/BOTOGRAD_TECH/botkit-store
builder: newgen
fixture: admin_seed
seed: true

actors:
  admin:
    user_id: 424242
    name: "Админ"

tags: [regression, ui]
covers: admin-product

steps:
  - send: "/admin"
    as: admin
    pause: 2.0
    expect:
      text_contains: ["Введите пароль"]
  - send: "farm"
    pause: 2.0
    as: admin
    expect:
      text_contains: ["Добро пожаловать"]
  - send: "🗂 Категории"
    pause: 2.0
    as: admin
    expect:
      text_contains: ["🗂 Категории"]
      buttons_contains: ["✅ Электроника (1)"]
  - click: "✅ Электроника (1)"
    pause: 2.0
    as: admin
    expect:
      buttons_contains: ["🛍 Товары категории"]
  - click: "🛍 Товары категории"
    pause: 2.0
    as: admin
    expect:
      text_contains: ["Товары категории"]
      buttons_contains: ["✅ Сертификат на 100 Stars — 100 Stars (ostatok: 3)"]
  - click: "✅ Сертификат на 100 Stars — 100 Stars (ostatok: 3)"
    pause: 2.0
    as: admin
    expect:
      text_contains: ["Сертификат на 100 Stars"]
      buttons_contains: ["✏️ Редактировать", "🔄 Активность", "🔑 Ключи (пополнить)", "🗑 Удалить"]
