# доносит до обработчика гарантированно: остановить его может только is_admin.
# Без гарда бот отвечает «Отменено.» и открывает админ-меню — это и ловит кейс.
# Шаг шлёт сырые callback_data: у гостя такой кнопки нет и быть не может.
- callback: order_cancel
  as: guest
  expect:
    silent: true
